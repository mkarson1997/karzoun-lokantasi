name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate local HTML references
        run: python scripts/validate_static.py

      - name: Check JavaScript syntax
        shell: bash
        run: |
          if [ -d js ]; then
            find js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi
